name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash setup.sh
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kosha-library-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk KoshasLibrary.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kosha's Library (latest)
          body: Tap KoshasLibrary.apk below to download and install on Android.
          files: KoshasLibrary.apk
          make_latest: true
