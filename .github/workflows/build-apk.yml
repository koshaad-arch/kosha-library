name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash setup.sh
      - name: Analyze and Goodreads check (informational)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > build.log 2>&1 || true
          dart run tool/gr_check.dart 152185079 >> build.log 2>&1 || true
          dart run tool/gr_check.dart https://www.goodreads.com/user/show/5228124 >> build.log 2>&1 || true
          tail -40 build.log
      - name: Build APKs
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee -a build.log
          flutter build apk --release --split-per-abi 2>&1 | tee -a build.log
      - name: Publish build log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Build log
          body: Latest build log.
          files: build.log
          make_latest: false
      - uses: actions/upload-artifact@v4
        with:
          name: kosha-library-apk
          path: build/app/outputs/flutter-apk/*.apk
      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk KoshasLibrary.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk KoshasLibrary-small.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kosha's Library (latest)
          body: Download KoshasLibrary-small.apk (works on almost all phones). If it will not install, use KoshasLibrary.apk.
          files: |
            KoshasLibrary-small.apk
            KoshasLibrary.apk
          make_latest: true
