name: Test install on emulator
on:
  push:
    paths: ['.github/workflows/test-install.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - name: Download released APK
        run: curl -sL -o app.apk https://github.com/${{ github.repository }}/releases/download/latest/KoshasLibrary.apk && ls -la app.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          profile: pixel_6
          script: bash tool/emu_flow.sh
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: emulator-test
          name: Emulator test
          body: Screenshots from the latest emulator test.
          files: |
            shot*.png
            emu.log
          make_latest: false
