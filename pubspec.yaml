name: kosha_library
description: Kosha's Library — a cozy book tracker with ISBN lookup and barcode scanning.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  mobile_scanner: ^7.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  excel: ^4.0.6
  webview_flutter: ^4.10.0
  path_provider: ^2.1.4
  archive: '>=3.4.0 <5.0.0'
  xml: '>=6.3.0 <8.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pdfjs/
    - assets/pdfjs/cmaps/
    - assets/pdfjs/standard_fonts/
    - assets/pdfjs/images/
